name: Actualizar disponibilidad

on:
  schedule:
    - cron: '15 7 * * *'   # cada día a las 07:15 UTC (08:15 en invierno / 09:15 en verano, hora de Madrid)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v5

      - name: Leer la web de la promoción
        shell: pwsh
        run: ./servidor.ps1 -SoloLeer

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/historial.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Lectura diaria $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
